name: P-024 Browser Retrieval Provenance

on:
  pull_request:
    paths:
      - app/**
      - scripts/verify_operator_retrieval_provenance.py
      - tests/test_operator_browser_retrieval_provenance_proof_contract.py
      - .github/workflows/p024-retrieval-provenance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-retrieval-provenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Firebat environment
        run: |
          cp .env.firebat.example .env.firebat
          sed -i 's/HOST_PORT=8701/HOST_PORT=18701/' .env.firebat
          sed -i 's/LOCAL_LLM_TIMEOUT=5/LOCAL_LLM_TIMEOUT=2/' .env.firebat
          chmod 600 .env.firebat
          echo 'APP_VERSION=ci' >> "$GITHUB_ENV"
          echo "GIT_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo 'HOST_PORT=18701' >> "$GITHUB_ENV"

      - name: Build and start production image
        run: |
          docker compose --env-file .env.firebat -f compose.firebat.yml build app
          docker compose --env-file .env.firebat -f compose.firebat.yml up -d
          chmod +x scripts/healthcheck-firebat.sh
          HEALTHCHECK_MAX_ATTEMPTS=90 sh scripts/healthcheck-firebat.sh

      - name: Verify persisted RAG_RETRIEVED provenance rendering and clear behavior
        env:
          OPERATOR_BASE_URL: http://127.0.0.1:18701
          OPERATOR_ARTIFACT_DIR: /tmp/operator-proof
        run: |
          google-chrome --version
          python -m pip install --disable-pip-version-check 'selenium==4.35.0'
          python scripts/verify_operator_retrieval_provenance.py

      - name: Capture diagnostics
        if: always()
        run: |
          docker compose --env-file .env.firebat -f compose.firebat.yml ps || true
          docker compose --env-file .env.firebat -f compose.firebat.yml logs --tail=250 app > p024-retrieval-provenance-container.log 2>&1 || true
          cp /tmp/operator-proof/operator-retrieval-provenance-evidence.json operator-retrieval-provenance-evidence.json 2>/dev/null || true
          cp /tmp/operator-proof/operator-retrieval-provenance.png operator-retrieval-provenance.png 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-agent-p024-retrieval-provenance
          path: |
            p024-retrieval-provenance-container.log
            operator-retrieval-provenance-evidence.json
            operator-retrieval-provenance.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Firebat service
        if: always()
        run: docker compose --env-file .env.firebat -f compose.firebat.yml down -v || true

# Contract anchors: retrieval-embedding-provider retrieval-embedding-model retrieval-embedding-dimensions
# Persisted source: RAG_RETRIEVED embedding_provider embedding_model embedding_dimensions
# Explicit unavailable state: Retrieval provenance unavailable.
