name: P-019 Browser Rejection Rationale Run Binding

on:
  pull_request:
    paths:
      - app/**
      - scripts/verify_operator_rejection_rationale_run_binding.py
      - tests/test_operator_rejection_rationale_run_binding_contract.py
      - .github/workflows/p019-rejection-rationale-run-binding.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-rejection-rationale-run-binding:
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - uses: actions/checkout@v4

      - name: Prepare Firebat environment
        run: |
          cp .env.firebat.example .env.firebat
          sed -i 's/HOST_PORT=8701/HOST_PORT=18701/' .env.firebat
          sed -i 's/LOCAL_LLM_TIMEOUT=5/LOCAL_LLM_TIMEOUT=2/' .env.firebat
          chmod 600 .env.firebat
          echo 'APP_VERSION=ci' >> "$GITHUB_ENV"
          echo "GIT_REVISION=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo 'HOST_PORT=18701' >> "$GITHUB_ENV"

      - name: Build and start production image
        run: |
          docker compose --env-file .env.firebat -f compose.firebat.yml build app
          docker compose --env-file .env.firebat -f compose.firebat.yml up -d
          chmod +x scripts/healthcheck-firebat.sh
          HEALTHCHECK_MAX_ATTEMPTS=90 sh scripts/healthcheck-firebat.sh

      - name: Verify two-run rejection rationale binding
        env:
          OPERATOR_BASE_URL: http://127.0.0.1:18701
          OPERATOR_ARTIFACT_DIR: /tmp/operator-proof
        run: |
          google-chrome --version
          python -m pip install --disable-pip-version-check 'selenium==4.35.0'
          python scripts/verify_operator_rejection_rationale_run_binding.py

      - name: Capture diagnostics
        if: always()
        run: |
          docker compose --env-file .env.firebat -f compose.firebat.yml ps || true
          docker compose --env-file .env.firebat -f compose.firebat.yml logs --tail=250 app > p019-rejection-rationale-run-binding-container.log 2>&1 || true
          cp /tmp/operator-proof/operator-rejection-rationale-run-binding-evidence.json operator-rejection-rationale-run-binding-evidence.json 2>/dev/null || true
          cp /tmp/operator-proof/operator-rejection-rationale-run-binding.png operator-rejection-rationale-run-binding.png 2>/dev/null || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guided-agent-p019-rejection-rationale-run-binding
          path: |
            p019-rejection-rationale-run-binding-container.log
            operator-rejection-rationale-run-binding-evidence.json
            operator-rejection-rationale-run-binding.png
          if-no-files-found: ignore
          retention-days: 14

      - name: Stop Firebat service
        if: always()
        run: docker compose --env-file .env.firebat -f compose.firebat.yml down -v || true
